<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">RelaDock 产品原理图</title>
  <desc id="desc">展示客户业务流量经香港入口节点透明转发至客户自有新加坡落地服务，以及控制平台、节点 Agent、逐规则计量、账务和告警形成的闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183153" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #536178; }
      .section { font-size: 22px; font-weight: 700; }
      .box-title { font-size: 22px; font-weight: 700; }
      .box-text { font-size: 17px; fill: #44516a; }
      .small { font-size: 15px; fill: #5e6c84; }
      .label { font-size: 16px; font-weight: 600; }
      .white { fill: #ffffff; }
      .danger { fill: #9f1239; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <text x="80" y="72" class="title">RelaDock 产品原理图</text>
  <text x="80" y="108" class="subtitle">控制面负责规则、计费与配置交付；客户业务流量只经过中转节点，不经过控制 API。</text>

  <text x="80" y="164" class="section">业务数据路径</text>
  <rect x="70" y="185" width="1460" height="300" rx="28" fill="#ffffff" stroke="#dbe5f5" stroke-width="2" filter="url(#shadow)"/>

  <rect x="105" y="245" width="280" height="160" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="155" cy="292" r="22" fill="#2563eb"/>
  <path d="M145 293h20M155 283v20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="195" y="285" class="box-title">客户业务终端</text>
  <text x="195" y="316" class="box-text">自有 VPN / 代理客户端</text>
  <text x="195" y="344" class="box-text">由客户自行管理</text>
  <text x="195" y="378" class="small">RelaDock 不管理终端账号或订阅</text>

  <rect x="485" y="245" width="280" height="160" rx="20" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="515" y="286" class="box-title">香港入口节点</text>
  <text x="515" y="322" class="box-text">公网 IP : 分配端口</text>
  <text x="515" y="352" class="box-text">TCP / UDP 外层流量</text>
  <text x="515" y="382" class="small">端口由数据库约束唯一预留</text>

  <rect x="865" y="215" width="300" height="220" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="895" y="257" class="box-title">透明中转数据面</text>
  <rect x="895" y="278" width="240" height="48" rx="12" fill="#d1fae5"/>
  <text x="1015" y="308" text-anchor="middle" class="label">nftables · DNAT / SNAT</text>
  <rect x="895" y="338" width="240" height="48" rx="12" fill="#d1fae5"/>
  <text x="1015" y="368" text-anchor="middle" class="label">tc · 每规则双向合计限速</text>
  <text x="1015" y="414" text-anchor="middle" class="small">不解密、不终结客户协议</text>

  <rect x="1265" y="245" width="230" height="160" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="1295" y="286" class="box-title">客户自有落地</text>
  <text x="1295" y="322" class="box-text">新加坡目标 IP : 端口</text>
  <text x="1295" y="352" class="box-text">VPN / 代理服务端</text>
  <text x="1295" y="382" class="small">由客户运营和维护</text>

  <path d="M385 305 H470" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M765 305 H850" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M1165 305 H1250" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M1250 366 H1180 M850 366 H780 M470 366 H400" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="427" y="286" text-anchor="middle" class="small">请求</text>
  <text x="807" y="286" text-anchor="middle" class="small">转发</text>
  <text x="1207" y="286" text-anchor="middle" class="small">到达目标</text>
  <text x="817" y="397" text-anchor="middle" class="small">返回流量</text>

  <text x="80" y="540" class="section">商业与运维闭环</text>
  <rect x="70" y="562" width="1460" height="270" rx="28" fill="#ffffff" stroke="#dbe5f5" stroke-width="2" filter="url(#shadow)"/>

  <rect x="105" y="615" width="245" height="145" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="135" y="655" class="box-title">企业控制台 / API</text>
  <text x="135" y="692" class="box-text">购买或续费单规则套餐</text>
  <text x="135" y="722" class="box-text">创建 TCP / UDP 转发规则</text>

  <rect x="435" y="600" width="270" height="175" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="465" y="640" class="box-title">Go 控制平台</text>
  <text x="465" y="677" class="box-text">端口预留与版本化快照</text>
  <text x="465" y="707" class="box-text">套餐、钱包、不可变账本</text>
  <text x="465" y="737" class="box-text">审计、告警与工单</text>

  <rect x="790" y="600" width="270" height="175" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="820" y="640" class="box-title">mTLS 节点 Agent</text>
  <text x="820" y="677" class="box-text">领取并校验完整配置</text>
  <text x="820" y="707" class="box-text">显式 apply 后回报 ACK</text>
  <text x="820" y="737" class="box-text">本地 journal / WAL 持久化</text>

  <rect x="1145" y="600" width="350" height="175" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="1175" y="640" class="box-title">逐规则计量与续费</text>
  <text x="1175" y="677" class="box-text">上下行累计 · epoch / sequence 去重</text>
  <text x="1175" y="707" class="box-text">迟到流量归原周期，不重复扣减</text>
  <text x="1175" y="737" class="box-text">额度耗尽 / 到期触发暂停和告警</text>

  <path d="M350 684 H420" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M705 684 H775" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1060 684 H1130" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <path d="M1320 790 C1320 850 225 850 225 775" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-teal)"/>
  <text x="385" y="669" text-anchor="middle" class="small">规则 / 订单</text>
  <text x="740" y="669" text-anchor="middle" class="small">配置交付</text>
  <text x="1095" y="669" text-anchor="middle" class="small">用量上报</text>
  <text x="760" y="874" text-anchor="middle" class="small">账单、告警、续费提醒返回企业客户</text>

  <rect x="70" y="885" width="1460" height="36" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="800" y="909" text-anchor="middle" class="label danger">产品边界：只透传客户业务流量，不提供 VPN 订阅、终端用户管理、协议密钥托管或消费者 VPN App。</text>
</svg>
