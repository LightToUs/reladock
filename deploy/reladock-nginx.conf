# RelaDock public site and console host boundary.
# Installed as /etc/nginx/sites-available/reladock by the deployment runbook.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name reladock.com www.reladock.com console.reladock.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/reladock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reladock.com/privkey.pem;
    ssl_protocols TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reladock.com;

    ssl_certificate /etc/letsencrypt/live/reladock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reladock.com/privkey.pem;
    ssl_protocols TLSv1.3;

    root /var/www/reladock/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /index.html {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.reladock.com;

    ssl_certificate /etc/letsencrypt/live/reladock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reladock.com/privkey.pem;
    ssl_protocols TLSv1.3;

    return 308 https://reladock.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.reladock.com;

    ssl_certificate /etc/letsencrypt/live/console.reladock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.reladock.com/privkey.pem;
    ssl_protocols TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name console.reladock.com;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_intercept_errors off;
    }
}
